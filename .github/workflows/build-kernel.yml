name: build-xnu-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ github.token }}
      UNIXNU_DEBUG_LDFILELIST: "1"
      XNU_MAKE_V: "1"
      GH_TOKEN: ${{ github.token }}
      # NativeUfs.cpp does not compile in this tree (three errors the archive log truncates away).
      # Build the read-only register probe in its place so the kernel links and reports what the
      # GCC and UFSHCI windows actually read.
      XNU_NABU_UFS_REGISTER_PROBE: "1"
      # UniXNU 2c11b09 ("adopt the xnu-linux-toolchain portability patches") made every host tool
      # compile with `-include $(HOST_SDKROOT)/usr/include/compat/hostcompat.h` and link
      # `-lhostcompat -luuid`. Both shims exist only in the Linux mock sysroot; the macOS SDK has
      # no compat/ directory, so the very first host tool (SETUP/config/externs.o) dies with
      #   fatal error: '.../MacOSX26.5.sdk/usr/include/compat/hostcompat.h' file not found
      # MakeInc.cmd defines both with plain `?=`, so an empty definition in the environment stops
      # make from ever assigning the Linux values. This is the whole macOS-side fix; the other
      # four patches in that commit are kernel-source only.
      HOST_COMPAT_CFLAGS: ""
      HOST_COMPAT_LIBS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo none
          # xnu-10063's MIG stubs must be generated by the oldest toolchain available:
          # newer iig emits IORPC.kernelContent / different reply-size metadata, and
          # mig_init() then trips "kroutine must have precise size" or overflows the
          # dispatch table. That is exactly where the boot was dying.
          # Upstream pins Xcode 26.6 on macos-26. Taking the oldest image instead gave the MIG
          # step an Xcode whose clang rejects -mach_msg2.
          XC=/Applications/Xcode_26.6.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "picked: $XC"
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
            echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $GITHUB_ENV
            echo "exported DEVELOPER_DIR=$XC/Contents/Developer"
          else
            echo "no Xcode 16 found"
          fi
          xcodebuild -version
          xcrun --find clang
      - name: Environment check
        run: |
          xcodebuild -version
          python3 --version
          uname -m
          df -h /

      - name: Clone UniXNU
        env:
          # The commit that was HEAD when board 6139dcc was pushed (2026-10-24 06:49Z).
          # Pinned by sha instead of tracking the branch tip, because HEAD moved twice in the
          # last day and broke the macOS build both times:
          #   2c11b09  (10-23 11:25Z) gave every host tool a -include of compat/hostcompat.h,
          #            which only exists in the Linux mock sysroot (see HOST_COMPAT_* above);
          #   f6883a7  (10-24 07:25Z) added NativeDwc3 and ff3450d defaulted its gate to on, so
          #            the link step now demands build/native-dwc3/libNativeDwc3.a, an archive
          #            this board.toml does not list.
          # f3f2ec2 is also the probe commit the 6139dcc notes describe, so the board config
          # and the toolchain come from the same moment. It still has the hostcompat patch,
          # which is why HOST_COMPAT_CFLAGS must stay empty.
          UNIXNU_REF: f3f2ec27a725c5d069a66bd135398e77788c7efa
        run: |
          git init -q UniXNU
          cd UniXNU
          git remote add origin https://github.com/Lux12138/UniXNU.git
          git fetch -q --depth 1 origin "$UNIXNU_REF"
          git checkout -q --detach FETCH_HEAD
          git submodule update -q --init --recursive --depth 1
          echo "checked out:"; git log --oneline -1

      - name: Select defconfig
        run: |
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig nabu_defconfig -D "$GITHUB_WORKSPACE"

      - name: Fetch sources
        run: cd UniXNU && ./unixnu fetch
        timeout-minutes: 60

      - name: Fetch IPSW
        run: cd UniXNU && ./unixnu ipsw fetch
        timeout-minutes: 60

      - name: Assemble tree
        run: cd UniXNU && ./unixnu tree
        timeout-minutes: 30

      - name: Drop the patches that only exist to prop up the Linux toolchain
        run: |
          # iig-method-forwarders.patch appends two definitions to
          # iokit/Kernel/IOUserServer.cpp:
          #   IOService::UserSetProperties(OSContainer * properties)
          #   IOService::SendIOMessageServicePropertyChange(void)
          # Its own comment states the reason it exists: "Apple's iig emits the DriverKit-facing
          # forwarders ... into the generated .iig.cpp, which the kernel build does not compile.
          # The Linux iig shim generates the declarations but not these definitions."
          # Reverse the polarity: on macOS the declarations are not in IOService.h either, so
          # each definition has no declaration to match and the kernel stops at
          #   IOUserServer.cpp:666:12: error: out-of-line definition of 'UserSetProperties'
          #       does not match any declaration in 'IOService'
          #   IOUserServer.cpp:672:12: error: out-of-line definition of
          #       'SendIOMessageServicePropertyChange' does not match any declaration in 'IOService'
          # Nothing else in the build references either symbol -- if it did, the same compile
          # would also carry "no member named ..." errors, and it does not -- so the definitions
          # are pure surplus here. This is the third patch out of 2c11b09 that is Linux-only;
          # linux-host-tools is neutralised through HOST_COMPAT_* above, and the remaining three
          # (linux-link-shims, llvm-clang-arm64-crypto-asm, portable-kalloc-type-builtins) are
          # harmless on Darwin, the kalloc one being guarded by __has_builtin.
          # build-xnu-4k-baseline.sh picks patches up with a shell glob over
          # $ROOT/patches/xnu/*.patch, and $ROOT is the assembled tree, so removing the tree
          # entry is enough -- the UniXNU checkout keeps its file untouched.
          TREE=UniXNU/out/nabu/tree/patches/xnu
          echo "--- before ---"; ls "$TREE" | grep -i iig || echo '(no iig patch)'
          rm -f "$TREE"/iig-method-forwarders*
          if ls "$TREE" | grep -qi iig; then echo "still present, failing"; exit 1; fi
          echo "--- after ---"; ls "$TREE" | grep -ci '\.patch$' | xargs -I{} echo "{} patches remain"

      - name: Inject GITHUB_TOKEN into API scripts
        run: |
          cd UniXNU/out/nabu/tree
          python3 - <<'PY'
          from pathlib import Path
          import os, glob
          token = os.environ.get("GITHUB_TOKEN", "")
          print("token present:", bool(token))
          patched = 0
          for f in glob.glob("scripts/*.py"):
              p = Path(f)
              s = p.read_text()
              if "api.github.com" not in s or "_UNIXNU_TOKEN_PATCH" in s:
                  continue
              if "import urllib.request" not in s:
                  continue
              patch = "import urllib.request\n_gh_token = __import__(\"os\").environ.get(\"GITHUB_TOKEN\", \"\")\nif _gh_token:\n    _orig_urlopen = urllib.request.urlopen\n    def _urlopen(url, *a, **kw):\n        req = urllib.request.Request(url) if isinstance(url, str) else url\n        req.add_header(\"Authorization\", \"Bearer \" + _gh_token)\n        req.add_header(\"Accept\", \"application/vnd.github+json\")\n        return _orig_urlopen(req, *a, **kw)\n    urllib.request.urlopen = _urlopen"
              s = s.replace("import urllib.request", patch, 1)
              p.write_text(s)
              patched += 1
              print("patched:", f)
          print("total:", patched)
          PY

      - name: Pre-cache XNU headers to /tmp (no API calls during build)
        run: |
          cd UniXNU/out/nabu/tree
          mkdir -p .cache/sources
          TAG="xnu-10063.121.3"
          TRUST_TAG="xnu-8796.101.5"
          SHORT=${TAG#xnu-}
          TSHORT=${TRUST_TAG#xnu-}
          echo "TAG=$TAG TRUST_TAG=$TRUST_TAG"
          curl -sL --fail -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit/crypto?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-crypto-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/EXTERNAL_HEADERS/TrustCache?ref=$TRUST_TAG" \
            -o ".cache/sources/xnu-trustcache-$TSHORT.json"
          echo "=== cached json ==="
          ls -la .cache/sources/
      # The reference checkout has to live outside out/nabu/tree: unixnu tree rebuilds that
      # directory, and a foreign directory inside it made the build fail with
      #   PermissionError: Operation not permitted: .../tree/refer/IOStorageFamily
      # The audit script resolves ROOT as parents[1] of its own path. Inside the build tree it
      # is linked to out/nabu/tree/scripts/, so it reads out/nabu/tree/refer/IOStorageFamily;
      # invoked from the device repository it reads UniXNU/refer/IOStorageFamily. Put a checkout
      # in both places rather than guessing which one runs.
      - name: Fetch IOStorageFamily (public Apple Darwin 23 source)
        run: |
          mkdir -p UniXNU/refer UniXNU/out/nabu/tree/refer
          for dir in UniXNU/refer/IOStorageFamily UniXNU/out/nabu/tree/refer/IOStorageFamily; do
            if [ ! -d "$dir/.git" ]; then
              rm -rf "$dir"
              git clone --filter=blob:none https://github.com/apple-oss-distributions/IOStorageFamily.git "$dir"
            fi
            git -C "$dir" checkout -q e45fbe30a7879e0b16e26dddb78538f1b00e0bff
            echo "$dir HEAD: $(git -C "$dir" rev-parse HEAD)"
          done

      # The kernel build is 8 of the 9 minutes. Reusing the object tree turns a full
      # rebuild into an incremental one, which is the only lever available without a macOS
      # host. A new key per commit always saves a fresh cache; restore-keys falls back to
      # the newest previous one so make only recompiles what changed.
      - name: Restore kernel object cache
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out/nabu/tree/.cache/xnu-work/build
          key: xnu-obj-${{ github.sha }}
          restore-keys: |
            xnu-obj-
          # The object tree is large; do not fail the run if the cache is unavailable.
          fail-on-cache-miss: false

      - name: Bootstrap kernel and prelinked candidate
        # The archive builders that bind against the "original candidate"
        # (build-native-legacy-display.py, build-ufs-original-bindings.py) read a prelinked kernel
        # from build/native-prelink. A cold checkout has none, so produce one first: this pass
        # builds a kernel with functions off and then copies it into the candidate names.
        run: |
          cd UniXNU
          # bootstrap configuration: no CONFIG_XNU_BUILD_ARCHIVES, so this pass produces only the
          # compile records and one kernel. Running the archive list here would recurse -- the
          # archives are what need the candidate this pass is creating.
          ./unixnu defconfig nabu_bootstrap_defconfig -D "$GITHUB_WORKSPACE"
          ./unixnu build kernel -D "$GITHUB_WORKSPACE"
          if [ -f out/nabu/kernel/kernel.macho ]; then
            mkdir -p out/nabu/tree/build/native-prelink
            cp out/nabu/kernel/kernel.macho \
               out/nabu/tree/build/native-prelink/native-owner-mobile-graphics-candidate.macho
            cp out/nabu/kernel/kernel.json \
               out/nabu/tree/build/native-prelink/native-owner-mobile-graphics-candidate.json
            cp out/nabu/kernel/kernel.macho \
               out/nabu/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.macho
            cp out/nabu/kernel/kernel.json \
               out/nabu/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.json
            # Do not leave the bootstrap kernel where the artifact step would pick it up.
            rm -f out/nabu/kernel/kernel.macho out/nabu/kernel/kernel.json
            ls -l out/nabu/tree/build/native-prelink/ || true
          else
            echo 'bootstrap kernel not produced; continuing'
          fi
        continue-on-error: true

      - name: Restore the real configuration
        # The bootstrap pass above selected nabu_bootstrap_defconfig; put the shipping
        # configuration back before the real build.
        run: |
          cd UniXNU
          ./unixnu defconfig nabu_defconfig -D "$GITHUB_WORKSPACE"

      - name: Build kernel

        run: |
          cd UniXNU
          # The tree was already assembled (and patched) by the "Assemble tree" step.
          # Re-running `unixnu tree` here applied the patches a second time, failed on
          # the ones that are not idempotent, and the `|| true` hid it -- leaving make to
          # build a half-patched tree. Build the tree that was actually assembled.
          ./unixnu build kernel
          ls -lh out/nabu/kernel/ || true
        timeout-minutes: 180

      # The documented pipeline is defconfig -> fetch -> tree -> ipsw fetch ->
      # build kernel -> build payload -> bootimg. We were stopping after build kernel and
      # assembling the payload by hand (copying kernel.macho, calling make-nabu-adt.py,
      # writing unixnu.toml, mcopy-ing a FAT volume). `build payload` does all of that from
      # board.toml: it generates the ADT, writes the config, and lays out the volume at
      # [payload] size_mib with the volume label.
      - name: Build payload
        if: always()
        run: |
          cd UniXNU
          ./unixnu build payload --unique-chip-id 0x1 || true
          echo '--- payload output ---'
          ls -lh out/nabu/payload/ 2>/dev/null || echo 'no payload dir'
          find out/nabu/payload -maxdepth 2 -type f 2>/dev/null | head -20 || true

      - name: Verify early checkpoint marks
        if: always()
        run: |
          echo "=== injection records in build logs ==="
          for f in UniXNU/out/nabu/logs/kernel.log UniXNU/out/nabu/logs/kernel-bootstrap.log; do
            if [ -f "$f" ]; then
              echo "--- $f"
              grep -a -E 'nabu pre-clean|marks inserted|WARN: mark' "$f" || echo "    (no mark record)"
            fi
          done
          echo "=== nabu symbols in the built mach-o ==="
          found=0
          while IFS= read -r k; do
            found=1
            echo "--- $k"
            ls -lh "$k"
            xcrun llvm-nm --defined-only "$k" 2>/dev/null | grep -i nabu_mark || echo "    (no nabu_mark symbol)"
          done < <(find UniXNU/out/nabu/kernel -name '*.macho' 2>/dev/null | head -5)
          [ "$found" = 1 ] || echo "(no mach-o in UniXNU/out/nabu/kernel)"

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "===== kernel.log (real build) ====="
          tail -250 UniXNU/out/nabu/logs/kernel.log 2>/dev/null || echo "(missing)"
          echo "===== kernel-bootstrap.log (record pass) ====="
          tail -60 UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null || echo "(missing)"
          echo "===== bootstrap errors (full file scan) ====="
          grep -a -nE 'error:|Error [0-9]|\*\*\*|undefined symbol|No such file|cannot find' \
            UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | head -25 || echo "(no error lines)"
          echo "===== bootstrap log size / tail of make output ====="
          wc -l UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null
          grep -a -nE 'make(\[[0-9]\])?:' UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | tail -10
          echo "===== where LDFILELIST is defined ====="
          cd UniXNU/out/nabu/tree/.cache/xnu-work 2>/dev/null && \
            grep -rn 'LDFILELIST' --include=Makefile* --include=*.cmd --include=*.def --include=*.top . 2>/dev/null | head -20
          echo "===== bsd filelist inputs present? ====="
          cd "$GITHUB_WORKSPACE/UniXNU/out/nabu/tree/.cache/xnu-work" 2>/dev/null && {
            ls -la bsd/conf/ 2>/dev/null | head -10
            echo "--- resolved bsd sources ---"
            ls build/obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT/*.o 2>/dev/null | wc -l
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-nabu
          path: |
            UniXNU/out/nabu/kernel/
            UniXNU/out/nabu/logs/
          if-no-files-found: warn



