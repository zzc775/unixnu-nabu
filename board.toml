# UniXNU device repo for Xiaomi Pad 5 (nabu)
# Forked values measured on a retail 6 GB + 256 GB unit (serial 9e92bc2d, 2026-10-23).
# Original: https://github.com/Lux12138/unixnu-nabu  (that unit is 12 GiB + 512 GB)

[board]
name = "nabu"
soc = "SM8150"
description = "Xiaomi Pad 5"
kit = "nabu"

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
# OS and Cryptex1,SystemOS are the two windows the userdata image is built from: the
# userdata step copies them byte for byte behind the SHNGROOT manifest. Without them
# `unixnu build userdata` has nothing to lay out, and the kernel has no root to mount.
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache",
         "OS", "Cryptex1,SystemOS"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[kernel]
defconfig = "nabu_defconfig"
# Archive builders run in order before the kernel link.
# build-arm-driver.py is absent from the main branch, and libpthread needs link.filelist
# which a bootstrap pass never reaches, so only corecrypto is built here.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
    # Produces build/storage-abi/include, which build-arm-driver.py adds to the
    # include path for NativeUfs / NativeVirtioBlock / NativeRamBlock.
    "audit-storage-interface.py",
  "build-arm-driver.py NativeUfs",
  # mockfs needs its fixture object; without it the file system code is present but the
  # mount path has no fixture to build against.
  "build-mockfs-fixture.py",
]

[payload.adt]
tool = "scripts/make-nabu-adt.py"
chip_id = "207"
# Measured 2026-10-23 via adb on a retail 6 GB unit:
#   /proc/meminfo MemTotal = 5637452 kB (5.38 GiB)
#   6 GiB = 6291456 kB, so ~638 MB is reserved for modem/hyp/tz.
# dram_size is the physical total: 6 GiB.
dram_size = "0x180000000"
# DarwinBoot searches for a contiguous physical window starting at 0x80000000 (the
# reference log shows pa=0x80070000). On 12 GiB the reference used 4.75 GiB; on a 6 GiB
# unit the top of DRAM carries the reservations, so start conservative with 2 GiB
# (0x80000000..0x100000000). The window itself only needs 768 MiB.
# Raise to 0x100000000 (4 GiB) once userspace needs more DRAM.
owned_memory_size = "0x80000000"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

[userdata]
# Measured 2026-10-23 on a retail 256 GB unit:
#   fastboot getvar partition-size:userdata = 0x387B2000000 = 242,782,810,112 B
#   logical-block-size = 0x1000 (4096), so the partition is exactly 59,273,147 LBA.
#
# first_lba carries over from the reference because the layout *before* userdata is
# fixed by the firmware (super alone is 8.5 GiB) and does not depend on capacity.
# Cross-check with our numbers on a 256,060,514,304 B disk:
#   userdata ends at 253.67 GB, leaving 2.39 GB at the tail;
#   the known tail partitions (cust 1 GiB, rescue, rawdump, minidump, logdump, splash,
#   metadata, ...) add up to 1.67 GB; and "disk - (userdata + tail)" gives 11.60 GB for
#   everything before userdata against 11.36 GB actually there. Residual 0.24 GB is GPT
#   plus per-partition alignment, which is exactly what to expect.
first_lba = 0x288C40
# last_lba = first_lba + 59,273,147 - 1
# The reference value 0x77BF3FA belongs to a 464 GiB userdata on a 512 GB unit and must
# not be reused here: it points past the end of this partition.
last_lba = 0x3B0FBFA
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  # Dropped for the NativeUfs experiment: apfs pulls com.apple.iokit.IOStorageFamily
  # into the prelink closure, and that kext defines IOBlockStorageDevice. With
  # NativeUfs enabled the build also links build/storage-abi/IOBlockStorageDevice-reference.o
  # (see scripts/build-xnu-4k-baseline.sh), so the class exists twice and OSMetaClass
  # panics at boot with "class IOBlockStorageDevice is a duplicate". sheng never hits
  # this because its archives list has no audit-storage-interface.py, so the reference
  # object is absent. Neither APFS nor a root volume is reachable at this stage anyway;
  # put this line back once the storage ABI question is settled.
  # "com.apple.filesystems.apfs",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  # The boot log now reaches "IOsurfaceRoot:installMemoryRegions()" and stops, so
  # IOSurface is needed. It was removed earlier to avoid duplicating
  # IOSurfaceFamily; with IOMobileGraphicsFamily already dropped, only IOGPUFamily
  # pulls that dependency, so adding IOSurface back should not reintroduce the
  # duplicate OSMetaClass registration.
  "com.apple.iokit.IOSurface",
  "com.apple.iokit.IOGPUFamily",
  # Removed com.apple.iokit.IOMobileGraphicsFamily: it and IOGPUFamily both depend on
  # IOSurfaceFamily, and native_prelink.plan() uses a plain list for its work queue,
  # so the shared dependency is packed once per puller and OSMetaClass rejects the
  # duplicate class. IOGPUFamily still pulls IOSurfaceFamily in a single time.
  "com.apple.iokit.IOReportFamily",
  # Removed com.apple.iokit.IOStorageFamily: it is already pulled in by
  # com.apple.filesystems.apfs, and native_prelink.plan() walks roots with a plain
  # list, so a root that is also a dependency gets packed twice.
  # Removed com.apple.iokit.IOSurface: both it and IOGPUFamily pull in
  # IOSurfaceFamily, so prelink packs that kext twice and OSMetaClass panics with
  # "Kext ... class ... is a duplicate". IOGPUFamily still brings IOSurfaceFamily
  # in once, which is enough for the graphics stack.
  # pthread_shims.c aborts with "pthread kernel extension not loaded (function table)"
  # unless com.apple.kec.pthread is prelinked: it supplies the pthread function table
  # the shims call through.
  "com.apple.kec.pthread",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
]
